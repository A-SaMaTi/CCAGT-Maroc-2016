<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --ink:#1b2422; --muted:#5d6966; --line:#dfe5e3;
  --accent:#0d5e57; --on-accent:#ffffff; --soft:#e2eeec; --warn:#fbf1dc; --warnb:#d9b45f; --star:#c98a00;
  --serif:"Noto Serif", Georgia, serif; --sans:Roboto, "Noto Sans", system-ui, sans-serif; --mono:"Roboto Mono", "Droid Sans Mono", monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#101614; --card:#18201e; --ink:#e3ebe8; --muted:#9aa8a4; --line:#2a3532;
  --accent:#5fc2b5; --on-accent:#0b1715; --soft:#1c3330; --warn:#33290f; --warnb:#8a6a25; --star:#f0b93a; color-scheme:dark}}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
a{color:var(--accent)}
header{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;gap:6px;height:56px;padding:0 6px}
header h1{font:600 18px var(--sans);margin:0 6px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border:0;background:transparent;color:inherit;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.ib:active{background:rgba(255,255,255,.15)}
.ib svg{width:24px;height:24px;fill:currentColor}
main{padding:68px 14px 86px;max-width:760px;margin:0 auto}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);height:64px}
nav.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:500}
nav.bottom a svg{width:24px;height:24px;fill:currentColor;padding:2px 14px;box-sizing:content-box;border-radius:14px}
nav.bottom a.on{color:var(--ink)}
nav.bottom a.on svg{background:var(--soft);color:var(--accent)}
h2{font:700 22px/1.25 var(--serif);margin:6px 0 10px}
h3{font:700 17px/1.3 var(--serif);margin:18px 0 8px}
.eye{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono)}
.note{background:var(--warn);border:1px solid var(--warnb);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.meta b{color:var(--muted);font-weight:500}
.chap{display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:inherit}
.chap .badge{flex:none;width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font:700 14px var(--mono)}
.chap .t{font-weight:600}
.chap .s{font-size:12.5px;color:var(--muted)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:10px 0}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.row:last-child{border-bottom:0}
.row:active{background:var(--soft)}
.row .n{flex:none;width:34px;font:700 14px var(--mono);color:var(--accent)}
.row .t{flex:1;min-width:0}
.row .st{color:var(--star);font-size:16px}
.grp{font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 4px 6px}
ul.pts{margin:6px 0;padding-left:18px}
ul.pts li{margin:5px 0}
a.x{font-family:var(--mono);font-size:.92em;text-decoration:none;background:var(--soft);padding:0 4px;border-radius:4px;white-space:nowrap}
.search{position:sticky;top:56px;z-index:3;background:var(--bg);padding:8px 0}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:28px;background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.v{font:700 13px var(--mono);white-space:nowrap;color:var(--accent)}
.tbl td.a{white-space:nowrap;text-align:right}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:3px;margin:6px 0 12px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:500 14px var(--sans);padding:8px;border-radius:18px}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.art-h{display:flex;align-items:baseline;gap:10px}
.art-h .n{font:700 26px var(--mono);color:var(--accent)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.pager a{flex:1;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:inherit;font-size:13px;min-width:0}
.pager a span{display:block;color:var(--muted);font-size:11.5px}
.pager a.r{text-align:right}
.flow .stp{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.flow .stp:last-child{border:0}
.flow .d{flex:none;width:86px;font:700 13px var(--mono);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
mark{background:#f7e08a;color:#1b2422;border-radius:2px}
</style>

<script>
const DATA = {"CH":[{"id":"c1","num":"I","title":"Dispositions générales","from":1,"to":13,"syn":"<p>Le chapitre pose le cadre contractuel. Le CCAG-T ne s'applique qu'aux marchés dont le CPS y fait expressément référence, et on ne peut y déroger que dans les cas qu'il prévoit ; le CPS doit lister les articles auxquels il déroge.</p><p>Il définit les acteurs (maître d'ouvrage, maître d'œuvre, agent chargé du suivi) et les registres (cahier de chantier tenu par l'entrepreneur, registre du marché tenu par le maître d'ouvrage), fixe la hiérarchie des pièces contractuelles et les règles de computation des délais. L'ordre de service est l'outil central de pilotage, avec une procédure stricte de réserves.</p>","keys":["Ordre de priorité des pièces : acte d'engagement, CPS, bordereau des prix, détail estimatif… CCAG-T en dernier ([[5]])","Délai d'exécution immuable, courant à partir de la date fixée par l'OS de commencement ; jours calendaires ([[8]])","Réserves sur un OS : mention « signé avec réserve » puis explication écrite sous 10 jours, sous peine de forclusion ([[11]])","Quatorze cas limitatifs d'avenant ([[12]])"]},{"id":"c2","num":"II","title":"Garanties du marché","from":14,"to":19,"syn":"<p>Trois garanties pécuniaires couvrent le maître d'ouvrage : le cautionnement provisoire (pendant la consultation), le cautionnement définitif et la retenue de garantie (pendant l'exécution). Toutes peuvent être remplacées par des cautions personnelles et solidaires d'établissements agréés.</p><p>Le chapitre précise quand le maître d'ouvrage peut les saisir et quand il doit les restituer : le cautionnement définitif et la retenue de garantie sont libérés à la signature du PV de réception définitive.</p>","keys":["Cautionnement définitif : 3 % du montant initial, à constituer sous 20 jours ([[15]])","Retenue de garantie : 1/10 des acomptes, plafonnée à 7 % ([[16]], [[64]])","Pénalité de 1 % si le définitif n'est pas constitué alors qu'aucun provisoire n'était exigé ([[18]])","Restitution à la réception définitive, ou au prorata en cas de réceptions partielles ([[19]])"]},{"id":"c3","num":"III","title":"Obligations générales de l'entrepreneur","from":20,"to":38,"syn":"<p>C'est le chapitre le plus long. Il encadre la présence et la représentation de l'entrepreneur, son personnel, son matériel, ses assurances et sa responsabilité vis-à-vis des tiers. L'entrepreneur doit affecter au chantier le matériel annoncé dans son offre et ne peut le retirer sans informer le maître d'ouvrage.</p><p>Le CCAG-T 2016 renforce nettement les volets sociaux et environnementaux : gestion et traçabilité des déchets, protection de l'environnement, badge d'identification du personnel, liste exhaustive des employés, et alphabétisation obligatoire sur les chantiers de 18 mois et plus. Le maître d'ouvrage doit arrêter le chantier si la sécurité est insuffisante, sans que l'arrêt prolonge le délai.</p>","keys":["Attestations d'assurance exigées avant tout démarrage ; décennale si le CPS le prévoit ([[25]])","Silence du maître d'ouvrage pendant 10 jours = acceptation du représentant ou du retrait de matériel ([[21]], [[24]])","Arrêt de chantier pour sécurité compris dans le délai, avec pénalités de retard possibles ([[33]], [[34]])","Alphabétisation obligatoire, au moins 4 h par semaine, si délai ≥ 18 mois ([[35]])","Bordereau de suivi obligatoire pour les déchets dangereux ([[31]])"]},{"id":"c4","num":"IV","title":"Préparation et exécution des travaux","from":39,"to":47,"syn":"<p>Le maître d'ouvrage doit livrer un chantier « prêt » : autorisations administratives, emprises gratuites, localisation des réseaux enterrés, plans « bon pour exécution ». S'il manque à ces obligations, il doit ajourner les travaux. L'entrepreneur, de son côté, soumet planning et mémoire technique, emploie des matériaux conformes aux normes marocaines homologuées et ne modifie rien de lui-même.</p><p>Le chapitre règle aussi les vices de construction, les sujétions non indemnisables et la force majeure, dont le CPS peut fixer les seuils d'intempéries.</p>","keys":["OS de commencement sous 30 jours après l'approbation, sinon droit à résiliation ([[40]])","Silence du maître d'ouvrage 15 jours = agrément du planning et des documents ([[41]])","Ouvrage plus grand que prévu : payé au prévu ; plus petit : payé au constaté ([[43]])","Force majeure : notification par lettre recommandée sous 7 jours ; résiliation possible après 60 jours ([[47]])"]},{"id":"c5","num":"V","title":"Interruption des travaux","from":48,"to":52,"syn":"<p>Le chapitre distingue l'ajournement (suspension temporaire décidée par le maître d'ouvrage), la cessation (arrêt définitif valant résiliation) et les événements touchant la personne de l'entrepreneur : décès, incapacité, liquidation ou redressement judiciaire.</p><p>L'ajournement total ne compte pas dans le délai et ouvre droit à indemnisation des frais de garde et du préjudice. Au-delà de 12 mois cumulés, l'entrepreneur peut demander la résiliation. Les délais de demande sont des délais de forclusion.</p>","keys":["Demandes d'indemnité et de résiliation enfermées dans des délais de 40 jours ([[48]], [[49]])","Ajournement partiel : délai supplémentaire par avenant, sur mémoire technique ([[48]])","Décès ou incapacité : résiliation de plein droit sans indemnité, reprise possible par les héritiers ([[50]], [[51]])"]},{"id":"c6","num":"VI","title":"Prix et règlement des comptes","from":53,"to":72,"syn":"<p>Le cœur financier du marché. Les prix sont réputés couvrir toutes les dépenses et la marge de l'entrepreneur. Le chapitre fixe les seuils qui encadrent l'évolution du marché : travaux supplémentaires (10 %), augmentation dans la masse (10 %), diminution (25 %), variation des quantités (50 %), révision des prix (50 %).</p><p>Il organise la chaîne de paiement : attachements, décomptes provisoires mensuels, acomptes, puis décompte définitif. Il fixe les pénalités de retard, les intérêts moratoires et les droits de l'entrepreneur en cas de paiement tardif, et liste les cas de résiliation avec ou sans indemnité.</p>","keys":["Pénalités de retard : 1/1000 par jour calendaire, plafond 8 % ([[65]])","Pénalités particulières plafonnées à 2 % ([[66]])","Retard de paiement : ajournement possible après 4 mois, résiliation après 8 mois ([[67]])","Réserves sur le décompte définitif : mémoire sous 30 jours, sinon décompte réputé accepté ([[68]])","Attachements non contestés dans les délais réputés acceptés ([[61]])"]},{"id":"c7","num":"VII","title":"Réceptions et garanties","from":73,"to":78,"syn":"<p>La réception provisoire transfère la propriété et les risques au maître d'ouvrage et ouvre le délai de garantie de 12 mois, pendant lequel l'entrepreneur doit le parfait achèvement. Trois issues sont possibles à l'issue des opérations préalables : réception prononcée, réception différée jusqu'à levée des réserves, ou réception prononcée avec anomalies mineures à lever sous un mois.</p><p>La réception définitive clôt l'exécution, libère les garanties et fait courir la décennale. Elle suppose les plans de récolement remis et les indemnités d'occupation temporaire payées.</p>","keys":["Opérations préalables dans les 10 jours suivant l'avis d'achèvement ([[73]])","Réception provisoire effective à la date de l'avis de l'entrepreneur ([[73]])","Garantie de 12 mois sauf CPS ; usure normale exclue ([[75]])","Plans de récolement exigés pour la réception définitive ([[76]])"]},{"id":"c8","num":"VIII","title":"Mesures coercitives","from":79,"to":80,"syn":"<p>Un article pivot auquel tout le CCAG-T renvoie. En cas de manquement aux stipulations ou aux ordres de service, le maître d'ouvrage met en demeure l'entrepreneur avec un délai d'au moins 15 jours. Sans effet, l'autorité compétente doit, sous 30 jours, prononcer une résiliation (simple, avec confiscation du cautionnement, ou avec nouveau marché aux frais et risques) ou une mise en régie partielle, éventuellement suivie d'une exclusion des marchés publics.</p><p>Des règles spécifiques traitent la défaillance du mandataire ou d'un membre d'un groupement.</p>","keys":["Mise en demeure par OS, délai minimal 15 jours sauf urgence ([[79]])","Excédents de dépenses à la charge du défaillant ; économies acquises au maître d'ouvrage ([[79]])","Nouveau mandataire désigné sous 10 jours si le mandataire est défaillant ([[80]])"]},{"id":"c9","num":"IX","title":"Règlement des différends et litiges","from":81,"to":84,"syn":"<p>Une procédure amiable obligatoire à deux niveaux précède tout recours : réclamation au maître d'ouvrage, puis à l'autorité compétente. Ensuite seulement viennent la médiation ou l'arbitrage, d'un commun accord, ou le tribunal administratif.</p><p>Le recours se limite aux motifs déjà exposés dans le mémoire de réclamation : un mémoire incomplet ferme définitivement les griefs omis.</p>","keys":["Chaîne : maître d'ouvrage 30 j → saisine autorité 30 j → réponse 45 j → tribunal 60 j ([[81]], [[83]])","Médiation ou arbitrage sous 30 jours, d'un commun accord ([[82]])","Passé 60 jours, la décision est réputée acceptée ([[83]])"]}],"A":{"1":["Champ d'application",["Fixe les conditions d'exécution des marchés de travaux et les droits et obligations du maître d'ouvrage et de l'entrepreneur.","S'applique à tous les marchés de travaux dont le CPS s'y réfère expressément."]],"2":["Dérogations",["Aucune dérogation hors des cas prévus par le CCAG-T ; toute autre dérogation est réputée nulle.","Le CPS doit indiquer les articles auxquels il déroge."]],"3":["Définitions",["<b>Agent chargé du suivi</b> : personne désignée par le maître d'ouvrage pour suivre l'exécution.","<b>Cahier de chantier</b> : registre tenu par l'entrepreneur à la disposition du maître d'ouvrage ; y sont consignés opérations, incidents, ajournements, contrôles et traçabilité des déchets. Entrées datées et signées.","<b>Maître d'œuvre</b> : chargé de la conception, du suivi et le cas échéant du contrôle. <b>Maître d'ouvrage</b> : y compris maître d'ouvrage délégué.","<b>Mémoire technique d'exécution</b> : organisation du chantier, moyens, planning, provenance et mise en œuvre des matériaux.","<b>Plan d'assurance qualité</b>, <b>plan d'implantation</b> (planimétrie et altimétrie par rapport à des repères fixes, notifié avec l'OS de commencement à défaut d'être au marché), <b>registre du marché</b> (tenu par le maître d'ouvrage)."]],"4":["Dévolution des attributions",["Dans les 15 jours suivant l'OS de commencement, le maître d'ouvrage notifie par OS le nom, la qualité et les missions de l'agent chargé du suivi et du maître d'œuvre.","Il notifie aussi les organismes de contrôle technique, de contrôle qualité et d'assistance technique dès qu'ils sont connus. Toute modification se fait par OS."]],"5":["Documents constitutifs du marché",["Ordre de priorité : a) acte d'engagement ; b) CPS ; c) bordereau des prix ; d) détail estimatif (peut former un seul document avec le bordereau) ; e) bordereau des prix des approvisionnements ; f) décomposition du montant global ou sous-détail des prix, si contractuels ; g) offre technique ; h) plans, notes de calcul, dossier géotechnique, mémoire technique, PAQ, si contractuels ; i) cahier des prescriptions communes ; j) CCAG-T.","En cas de contradiction, les documents prévalent dans cet ordre, sauf pour l'offre financière (art. 27 du décret) et sous réserve de l'[[2]]."]],"6":["Pièces contractuelles postérieures",["Les ordres de service, les avenants éventuels et la décision d'augmentation dans la masse des travaux prévue à l'[[57]]."]],"7":["Droits de timbre",["À la charge de l'entrepreneur, selon la législation en vigueur."]],"8":["Délais d'exécution",["Délai global : de la date de commencement fixée par OS à l'expiration du délai contractuel. Délais partiels possibles par partie ou phase.","Le délai est immuable. Il couvre aussi le repliement des installations et la remise en état des lieux, sauf stipulation contraire du CPS.","Une date limite d'achèvement n'a de valeur que si le CPS fixe aussi une date limite de commencement.","Computation : départ le lendemain du fait générateur à 0 h ; jours calendaires ; mois de quantième à quantième ; report au premier jour ouvrable si le dernier jour est férié ou chômé.","Délais supplémentaires possibles pour force majeure, ajournement partiel, augmentation dans la masse, travaux supplémentaires, limités au strict nécessaire.","Réduction possible par avenant de diminution ([[58]] §2)."]],"9":["Communications",["Toutes écrites, déposées contre récépissé ou envoyées en lettre recommandée avec accusé de réception ; la date du récépissé ou de l'AR fait foi.","Fax confirmé et courriel seulement à titre complémentaire. Les écrits sont consignés au registre du marché."]],"10":["Documents en cas d'audits et contrôles",["L'entrepreneur met à la disposition des auditeurs (art. 165 du décret) tout document nécessaire, limité au marché et à ses avenants."]],"11":["Ordres de service",["Écrits, signés, datés, numérotés et enregistrés ; établis en deux exemplaires. L'entrepreneur renvoie un exemplaire signé sous 3 jours, sinon l'OS est réputé reçu à sa date de notification.","Réserves : retour de l'OS avec la mention manuscrite « signé avec réserve », puis explication écrite sous 10 jours à compter de la notification, sous peine de forclusion.","L'exécution est suspendue, sauf second OS du maître d'ouvrage dans les 7 jours suivant les explications.","L'entrepreneur <b>doit</b> refuser le second OS (« signé avec les mêmes réserves ») s'il présente un danger d'effondrement ou pour la sécurité (justifié par un expert), est sans lien avec l'objet ou change le lieu, ou dépasse les taux des [[55]] et [[57]]. Le différend relève alors de l'[[81]].","Refus de recevoir : notification par huissier, puis PV de carence valant notification. Groupement : notification au seul mandataire."]],"12":["Avenants",["Contrat additif qui ne peut modifier ni l'objet ni le lieu d'exécution.","Cas limitatifs : changement de maître d'ouvrage, de raison sociale ou de domiciliation bancaire ; erreurs manifestes ; cession ([[27]]) ; modification des dimensions ([[43]]) ; force majeure ([[47]]) ; ajournement partiel ([[48]] §10) ; héritiers ([[50]]) ; travaux supplémentaires ([[55]]) ; provenance des matériaux ([[56]]) ; délais d'augmentation dans la masse ([[57]]) ; diminution de plus de 25 % ([[58]]) ; marchés-cadre et reconductibles ; nouveau mandataire ([[80]]) ; comptable assignataire ou règlement (loi 112-13 sur le nantissement).","Valable seulement après approbation par l'autorité compétente ; copie notifiée par OS."]],"13":["Pièces à délivrer – Nantissement",["Exemplaire certifié conforme de l'acte d'engagement, du CPS et des pièces constitutives remis gratuitement par OS sous 5 jours ouvrables après notification de l'approbation.","Observations de l'entrepreneur sur les documents remis sous 15 jours (le CPS peut porter ce délai à 30 jours au plus) ; ensuite il est réputé les avoir vérifiés.","Plans « bon pour exécution » dangereux ou contradictoires : l'entrepreneur sursoit et informe ([[11]]). Le maître d'ouvrage a 7 jours pour corriger (délai régularisé) ou confirmer par second OS (interruption non prise en compte). Persistance : [[81]].","Exemplaire unique destiné au nantissement délivré sur demande (loi 112-13)."]],"14":["Garanties pécuniaires",["Cautionnement provisoire, cautionnement définitif et retenue de garantie (dahir n° 1-56-211 du 11 décembre 1956).","Le CPS fixe leur importance et peut en dispenser tout ou partie."]],"15":["Cautionnement définitif",["3 % du montant initial, arrondi au dirham supérieur, sauf stipulation contraire du CPS. Un cautionnement par lot si le marché est alloti.","Constitué dans les 20 jours suivant la notification de l'approbation ; affecté jusqu'à la réception définitive."]],"16":["Retenue de garantie",["Prélevée sur les acomptes dans les conditions de l'[[64]], sauf stipulation différente du CPS."]],"17":["Cautions personnelles et solidaires",["Peuvent remplacer cautionnements et retenue de garantie ; choisies parmi les établissements agréés.","Retrait d'agrément de l'établissement : 20 jours pour constituer le cautionnement ou une autre caution, sinon retenue d'office d'un montant égal au cautionnement définitif."]],"18":["Droits du maître d'ouvrage sur les cautionnements",["Le provisoire est acquis si le concurrent retire son offre pendant sa validité, refuse de signer ou de recevoir l'approbation, ou ne constitue pas le définitif dans le délai de l'[[15]].","Si aucun provisoire n'était exigé et que le définitif n'est pas constitué à temps : pénalité de 1 % du montant initial.","Toute saisie fait l'objet d'une décision notifiée par OS et consignée au registre du marché."]],"19":["Restitution des garanties",["Le provisoire est restitué après constitution du définitif.","Le définitif est restitué et la retenue de garantie payée, sur mainlevée, dès la signature du PV de réception définitive (sauf application de l'[[79]]).","Réceptions définitives partielles : restitution au prorata."]],"20":["Domicile de l'entrepreneur",["Domicile au Maroc indiqué dans l'acte d'engagement ou notifié sous 15 jours après l'approbation ; à défaut, notifications valables au siège indiqué dans le CPS.","Changement de domicile signalé par lettre recommandée sous 15 jours."]],"21":["Présence sur les lieux des travaux",["Présence permanente de l'entrepreneur ou d'un représentant agréé, doté des pouvoirs nécessaires pour qu'aucune opération ne soit retardée.","Demande d'agrément écrite avant le commencement, précisant ses pouvoirs ; silence du maître d'ouvrage 10 jours = acceptation.","Obligation de répondre aux convocations ; PV de chaque réunion ou visite signé par les participants et consigné au cahier de chantier."]],"22":["Choix des collaborateurs",["Collaborateurs qualifiés ; le maître d'ouvrage peut exiger leur changement pour incapacité professionnelle ou défaut de probité.","L'entrepreneur répond des fraudes et malfaçons de ses collaborateurs."]],"23":["Protection des employés",["Entrepreneur et sous-traitants respectent les textes sur le recrutement et la paie, les droits sociaux, l'hygiène, la sécurité, les accidents du travail, la couverture médicale, l'immigration et la protection des mineurs et des femmes."]],"24":["Matériel de l'entrepreneur",["Matériel prévu dans l'offre, ou de performances au moins similaires.","Retrait partiel avant achèvement : demande écrite motivée ; le maître d'ouvrage a 10 jours pour répondre par OS motivé, son silence vaut accord. L'accord n'exonère pas l'entrepreneur."]],"25":["Assurances et responsabilités",["Avant tout commencement : attestations couvrant a) véhicules et engins, b) accidents du travail, c) responsabilité civile (dommages aux tiers jusqu'à la réception définitive ; aux agents du maître d'ouvrage sur le chantier jusqu'à la réception provisoire ; avec clause de renonciation à recours contre le maître d'ouvrage), d) dommages à l'ouvrage si le CPS le prévoit (incendie, vol, détérioration, hors cataclysmes) jusqu'à la réception provisoire.","Pas de démarrage sans ces attestations ; renouvellement continu ; aucune modification ou résiliation de police sans accord écrit préalable. Sanction : [[79]].","Décennale si le CPS le prévoit, pour les ouvrages neufs : engagement d'assureur avant le commencement, police remise au plus tard à la réception définitive, valable 10 ans à partir de celle-ci (art. 769 du DOC). La réception définitive est conditionnée à l'accord sur cette police.","Les points a) et b) s'appliquent aussi aux sous-traitants."]],"26":["Propriété industrielle ou commerciale",["L'entrepreneur garantit le maître d'ouvrage contre toute revendication (brevets, licences, marques, dessins) et supporte les redevances.","En cas d'action d'un tiers, il intervient à l'instance et indemnise le maître d'ouvrage. Les documents reçus ne servent qu'au marché."]],"27":["Cession du marché",["Interdite, sauf transfert de patrimoine lors d'une fusion ou d'une scission, sur autorisation expresse puis avenant.","Le cessionnaire doit remplir les conditions de l'art. 24 du décret."]],"28":["Police des chantiers",["Reconnaître emplacements et accès, respecter règlements et consignes des autorités, appliquer à ses frais les mesures de police.","Responsabilité de tout dommage aux propriétés publiques ou privées ; la surveillance du maître d'ouvrage ne l'en décharge pas.","Travaux intéressant la défense : renvoi possible d'ouvriers, obligation d'aviser immédiatement de tout acte de malveillance (sous peine de régie sans mise en demeure ou de résiliation), mesures de sécurité sans indemnité."]],"29":["Protection du secret",["Instructions consultées dans les bureaux du maître d'ouvrage ; éléments secrets et mesures notifiés.","Conservation des documents secrets, signalement de tout incident, obligation étendue aux sous-traitants. Sanction : [[79]]."]],"30":["Protection de l'environnement",["Maîtrise des déchets, poussières, fumées, polluants, bruit, impacts sur la faune et la flore, pollution des eaux ; sécurité des personnes et du voisinage.","Preuve de conformité sur demande ; exigences particulières en site sensible ou zone protégée."]],"31":["Gestion des déchets du chantier",["Élimination sous la responsabilité de l'entrepreneur : collecte, transport, stockage, tri, traitement, évacuation vers des lieux autorisés.","Traçabilité par bordereaux de suivi, obligatoires pour les déchets dangereux."]],"32":["Plusieurs entrepreneurs sur le même chantier",["Le CPS désigne un entrepreneur chargé de la coordination, du bon ordre et de la sécurité communs.","Planning général établi avec tous ; dépenses de coordination payées par un prix spécifique du bordereau."]],"33":["Mesures de sécurité et d'hygiène",["Définies par le CPC ou le CPS : logement, ravitaillement, hygiène, service médical, gardiennage, sécurité, environnement.","Badge d'identification permanent du personnel et des sous-traitants ; liste exhaustive et à jour du personnel ; accès réservé aux personnes identifiées.","Équipements (casques, gants, bottes, lunettes), voies, signalisation des abords, tranchées et sorties d'engins. Échafaudages et coffrages : plans et notes de calcul approuvés. Mesures spécifiques en agglomération.","Le maître d'ouvrage ou le maître d'œuvre inscrit ses remarques au cahier de chantier et <b>doit</b> arrêter le chantier si la sécurité est insuffisante. L'arrêt reste compris dans le délai, avec pénalités ([[65]]). Sanction : [[79]]."]],"34":["Soins et secours",["Service médical organisé et soins à la charge de l'entrepreneur ; salubrité, prévention des épidémies, vaccinations.","Non-respect des OS : arrêt de chantier compris dans le délai, pénalités possibles ([[65]])."]],"35":["Formation et alphabétisation",["Délai inférieur à 18 mois : action facultative.","Délai égal ou supérieur à 18 mois : obligatoire, au moins 4 heures par semaine, locaux équipés sur ou près du chantier, manuels adaptés, certificat en fin de cycle. Sanction : [[79]]."]],"36":["Transports",["Respect de la réglementation ; transport des matériaux, matériel et déblais à la charge de l'entrepreneur, sauf si le CPS prévoit les moyens du maître d'ouvrage."]],"37":["Démontage et démolition",["Demande au maître d'ouvrage 8 jours à l'avance ; silence = accord.","Matériaux et équipements récupérés : propriété du maître d'ouvrage, transport et stockage à la charge de l'entrepreneur dans la distance fixée par le CPS ; réemploi possible. Gravats enlevés au fur et à mesure."]],"38":["Découvertes en cours de travaux",["Objets d'art, d'antiquité, archéologiques ou précieux : signalement immédiat au maître d'ouvrage et aux autorités ; propriété de l'État ; pas de déplacement sans autorisation.","Indemnisation des sujétions si le maître d'ouvrage demande des soins particuliers. Restes humains : information immédiate. Ruines et tombes : autorisation écrite préalable."]],"39":["Préparation des travaux",["Le maître d'ouvrage délivre les autorisations (permis de construire, permission de voirie, occupation temporaire) et peut aider pour installations, dépôts de déblais et carrières.","Lieux mis gratuitement à disposition ; terrains supplémentaires aux frais de l'entrepreneur.","Réseaux enterrés : le maître d'ouvrage fournit leur nature et leur position pour piquetage spécial ; l'entrepreneur prévient l'administration concernée 10 jours avant les fouilles.","Plans « bon pour exécution » remis gratuitement selon le calendrier du CPS. Si le maître d'ouvrage manque à ces obligations, il doit ajourner les travaux par OS.","Panneau de chantier obligatoire : intervenants, délai, montant, mesures de sécurité."]],"40":["Commencement de l'exécution",["OS de commencement dans les 30 jours suivant la notification de l'approbation, après constitution du cautionnement définitif.","Date de démarrage au moins 10 jours après la notification de l'OS, sauf urgence.","OS non notifié à temps : l'entrepreneur peut demander la résiliation dans les 30 jours suivants, sous peine de forclusion ([[69]], avec indemnité)."]],"41":["Documents à établir par l'entrepreneur",["Planning, mesures générales, dessins, mémoire technique et modèle de cahier de chantier soumis dans les délais du CPS.","Le maître d'ouvrage a 15 jours pour agréer ou faire ses remarques ; son silence vaut agrément. Il peut subordonner certains ouvrages à cet agrément sans modifier le délai."]],"42":["Matériaux et produits",["Conformes aux normes marocaines homologuées ou, à défaut, internationales ; mis en œuvre selon les règles de l'art et le CPS.","Acceptation provisoire avant emploi ; refus possible jusqu'à la réception définitive en cas de mauvaise qualité, avec remplacement aux frais de l'entrepreneur.","Provenance justifiée sur demande (factures, bons de livraison, certificats d'origine)."]],"43":["Dimensions et dispositions des ouvrages",["Aucun changement de sa propre initiative ; reconstruction sur OS des ouvrages non conformes.","Changement accepté : dimensions supérieures → métrés sur les dimensions prescrites, sans supplément ; dimensions inférieures → métrés sur les dimensions constatées, nouveaux prix par avenant si besoin ([[12]])."]],"44":["Enlèvement du matériel et des matériaux",["Dégagement, nettoiement et remise en état au fur et à mesure.","À défaut : mise en demeure, puis pénalité journalière fixée par le CPS au-delà de 30 jours (le CPS peut réduire ce délai), sans préjudice de l'[[79]]."]],"45":["Vices de construction",["Jusqu'à la fin du délai de garantie, le maître d'ouvrage peut prescrire par OS motivé des investigations, y compris des démolitions, après avoir convoqué l'entrepreneur.","Vice constaté : remise en état et frais d'investigation à la charge de l'entrepreneur. Aucun vice : remboursement des dépenses, sans autre indemnité."]],"46":["Sujétions d'exécution – Pertes – Avaries",["Aucune réclamation pour les sujétions dues à l'exploitation normale du domaine public, aux réseaux existants ou aux travaux simultanés désignés au CPS (sous réserve de l'[[39]] §6).","Pas d'indemnité pour les pertes dues à négligence ou défaut de moyens ; protection obligatoire contre les phénomènes naturels prévisibles (crues, tempêtes, houle)."]],"47":["Cas de force majeure",["Droit à une augmentation raisonnable des délais par avenant ; aucune indemnité pour la perte de matériel, dont l'assurance est réputée incluse dans les prix.","Le CPS peut fixer le seuil des intempéries valant force majeure.","Notification par lettre recommandée sous 7 jours, avec les éléments constitutifs et les conséquences probables.","Au-delà de 30 jours : examen des incidences contractuelles ; au-delà de 60 jours : résiliation possible ([[69]])."]],"48":["Ajournement de l'exécution",["Suspension totale ou partielle pour une durée déterminée, par OS motivés d'arrêt et de reprise consignés au registre et au cahier de chantier. L'ajournement total n'entre pas dans le délai.","Constat contradictoire des ouvrages et matériels ; réception provisoire possible si les ouvrages sont utilisables ; l'entrepreneur garde le chantier.","Indemnisation des frais de garde et du préjudice, sur justificatifs. Ajournement ≤ 12 mois : demande sous 40 jours après l'OS invitant à prendre connaissance du décompte définitif ([[68]]). Au-delà de 12 mois : demande possible à tout moment jusqu'à ce même terme.","Au-delà de 12 mois cumulés : résiliation sur demande écrite sous 40 jours, sous peine de forclusion.","Ajournement partiel (plans non remis, contraintes étrangères à l'entrepreneur) : délai supplémentaire par avenant sur mémoire technique."]],"49":["Cessation des travaux",["Arrêt définitif par OS, avant ou après le commencement ; le marché est immédiatement résilié.","Indemnité si préjudice constaté, sur demande écrite sous 40 jours. Réception provisoire des parties exécutées, puis définitive après la garantie."]],"50":["Décès de l'entrepreneur",["Personne physique : résiliation de plein droit sans indemnité ; les héritiers peuvent proposer de continuer, décision sous 30 jours.","Plusieurs personnes : état contradictoire et décision de résilier ou continuer. Offres par lettre recommandée sous 15 jours ; continuation par avenant avec cautionnement ([[15]], [[17]])."]],"51":["Incapacité de l'entrepreneur",["Incapacité civile ou interdiction d'exercer : arrêt immédiat, résiliation de plein droit sans indemnité.","Incapacité physique ou mentale durable : résiliation possible sans indemnité."]],"52":["Liquidation ou redressement judiciaire",["Liquidation : résiliation de plein droit sans indemnité, sauf continuation acceptée par l'autorité si le syndic est autorisé.","Redressement : résiliation si l'entrepreneur n'est pas autorisé à poursuivre. Mesures conservatoires d'office à sa charge."]],"53":["Prix du marché",["Les prix couvrent toutes les dépenses (droits, impôts, taxes, frais généraux, faux frais) et une marge pour bénéfice et risques.","Ils incluent les accès, clôtures, sécurité, gardiennage et éclairage des parties communes, et le bureau du maître d'ouvrage si le CPS le prévoit. Groupement : y compris les coûts liés aux défaillances des membres."]],"54":["Révision des prix",["Le CPS précise si les prix sont révisables et donne la formule. Date de référence : date limite de remise des offres, ou date de signature en procédure négociée.","Variation du reste à exécuter de plus de 50 % en hausse ou en baisse du fait de la révision : résiliation d'office possible ; l'entrepreneur peut aussi la demander, sauf si le reste non révisé n'excède pas 10 % du montant initial. Décision sous 60 jours, travaux poursuivis entre-temps."]],"55":["Ouvrages ou travaux supplémentaires",["Travaux absents du marché initial, prescrits par OS immédiatement exécutable, s'ils sont accessoires, imprévus, justifiés par le délai ou la continuité, réalisables avec le matériel sur place, et limités à 10 % du montant initial.","Constatés par avenant (nature, prix, délai). Prix issus du marché initial, négociés aux prix courants, ou mixtes, avec les index correspondants.","Désaccord sur les prix nouveaux : [[81]], avec règlement provisoire aux prix du maître d'ouvrage."]],"56":["Changement de provenance des matériaux",["Possible si la provenance fixée au CPS donne des matériaux non conformes, si la carrière est fermée ou épuisée, ou si les quantités sont insuffisantes.","Avenant fixant le nouveau lieu et la plus- ou moins-value ; à défaut d'accord, [[81]]."]],"57":["Augmentation dans la masse des travaux",["Masse initiale : montant contractuel. Masse des travaux : travaux exécutés aux prix initiaux, hors travaux supplémentaires, révision, indemnités, intérêts moratoires et pénalités.","L'entrepreneur avertit 20 jours à l'avance de l'atteinte de la masse initiale, puis arrête les travaux s'il n'a pas reçu d'OS de poursuite.","La décision de poursuivre fixe un montant limite, intervient sous 20 jours et est notifiée par OS. À défaut, arrêt ou réception des travaux.","Augmentations cumulées limitées à 10 % de la masse initiale. Délai supplémentaire possible par avenant."]],"58":["Diminution dans la masse des travaux",["Diminution de plus de 25 % : indemnisation en fin de compte du préjudice subi au-delà de 25 %.","Cause connue avant le commencement : résiliation sur demande, ou avenant fixant le nouveau montant et le délai ([[69]])."]],"59":["Changement dans les quantités du détail estimatif",["L'entrepreneur poursuit, mais avertit par écrit quand la quantité d'un prix varie de plus de 50 % <b>et</b> que le montant correspondant dépasse 10 % du montant initial. En hausse, un OS est nécessaire pour poursuivre.","Indemnisation du préjudice justifié, demandée en fin de compte, plafonnée à 15 % du prix unitaire appliqué aux quantités au-delà de 50 %."]],"60":["Bases de règlement des travaux",["Prix unitaires : quantités réellement exécutées et constatées × prix du bordereau, plus la révision.","Prix global : la décomposition sert aux décomptes provisoires et à la révision ; les écarts de quantités ou les erreurs de la décomposition ne modifient pas le prix global.","Tranches conditionnelles : art. 8 du décret. Aucun usage ou coutume opposable pour les métrés."]],"61":["Attachements",["Relevé des travaux, par numéro de poste du bordereau, en trois parties : travaux terminés, non terminés, approvisionnements. Relevé contradictoire avant que des ouvrages deviennent cachés.","Établis par l'entrepreneur au moins à la fin de chaque mois. Le maître d'ouvrage les fait vérifier et rectifier sous 15 jours ; l'entrepreneur les renvoie acceptés ou commentés sous 15 jours, sinon ils sont réputés acceptés. Refus : PV de carence, décompte établi sur les attachements validés, contestation par l'[[81]].","Accord écrit du maître d'ouvrage sous 30 jours, sinon attachements réputés acceptés. La date de signature vaut constatation du service fait."]],"62":["Décomptes provisoires",["Dressés par l'agent chargé du suivi au moins une fois par mois à partir des attachements ; base des acomptes. Copie à l'entrepreneur sous 10 jours.","Le dernier décompte provisoire est réglé en attendant le définitif ; décompte rectificatif en cas d'erreur."]],"63":["Avances",["Conformément au décret n° 2-14-272 du 14 mai 2014 relatif aux avances."]],"64":["Acomptes – retenue de garantie",["Acomptes au rythme des décomptes, sous retenue de 1/10 (sauf dispense du CPS), plafonnée à 7 % du montant initial augmenté des avenants. Remplaçable par caution.","Approvisionnements payés jusqu'aux 4/5 de leur valeur si le CPS prévoit un bordereau des approvisionnements : acquis et payés, faisant partie des travaux, dans la limite des quantités nécessaires. Ils restent propriété de l'entrepreneur, qui ne peut les enlever sans autorisation."]],"65":["Pénalités et retenues pour retard",["Retard sur le délai global : 1/1000 du montant par jour calendaire, sauf CPS. Montant de base : initial, majoré des travaux supplémentaires et de l'augmentation dans la masse.","Délais partiels : pénalités fixées par le CPS, ou retenue provisoire de 1/1000 par jour, restituable si le délai global est tenu et si le CPS le prévoit.","Déduction d'office ; repos et jours fériés non déduits ; application jusqu'à la décision de résiliation.","Plafond 8 % ; une fois atteint, résiliation possible selon l'[[79]]."]],"66":["Pénalités particulières",["Prévues par le CPS pour retard de remise de documents ou manquement à certaines obligations ; plafond global 2 %."]],"67":["Retard dans le règlement des sommes dues",["Intérêts moratoires selon la réglementation.","Plus de 4 mois après la signature des attachements : droit à l'ajournement des travaux sur demande.","Plus de 8 mois : résiliation sur demande, sans autre indemnité ([[69]])."]],"68":["Décompte définitif",["Récapitule quantités, prix, révision, indemnités, pénalités, intérêts et retenues. Décompte partiel définitif pour une partie réceptionnée ; décompte général définitif récapitulant les partiels.","Établi par l'agent chargé du suivi et signé par le maître d'ouvrage. L'entrepreneur est invité par OS, dans le mois suivant la réception provisoire, à le signer.","Acceptation et approbation lient définitivement les parties. Absence ou refus de signer : PV, plus aucune réclamation recevable.","Signature avec réserves : mémoire de réclamation détaillé et chiffré sous 30 jours, puis [[81]] ; sinon décompte réputé accepté. Décompte rectificatif si les réserves sont fondées."]],"69":["Résiliation du marché",["Décision motivée de l'autorité compétente, notifiée et consignée au registre.","<b>Avec indemnité</b> (sur demande justifiée) : OS de commencement tardif ([[40]]), ajournement ([[48]]), cessation ([[49]]).","<b>Sans indemnité</b> : force majeure ([[47]]), décès ([[50]]), incapacité ([[51]]), procédure collective ([[52]]), révision au-delà de 50 % ([[54]]), diminution de plus de 25 % ([[58]]), retard d'exécution ([[65]]), retard de paiement de plus de 8 mois ([[67]]), mesures coercitives ([[79]])."]],"70":["Constatations et reprise en cas de résiliation",["Convocation sous 15 jours pour constater les ouvrages, inventorier matériaux et matériel ; PV avec avis du maître d'œuvre.","Mesures de conservation à exécuter sous 10 jours, sinon d'office ; évacuation dans le délai fixé, sous pénalité de 5/10 000 par jour. Réception provisoire des ouvrages exécutés.","Rachat possible des ouvrages provisoires et du matériel spécial (partie non amortie) et des approvisionnements (prix du bordereau ou négociés), intégré aux décomptes ([[62]], [[68]])."]],"71":["Calcul des indemnités",["Selon les bases du CPS ou à l'amiable ; à défaut, procédure des [[81]] à [[83]]."]],"72":["Dépenses à la charge de l'entrepreneur",["Prélevées sur les sommes dues, puis sur le cautionnement et la retenue de garantie, puis par ordre de recette."]],"73":["Réception provisoire",["Après contrôle de conformité. Transfère propriété et risques et ouvre la garantie ([[75]]).","Avis écrit d'achèvement de l'entrepreneur ; opérations préalables dans les 10 jours : reconnaissance, épreuves, inexécutions, malfaçons, repliement et remise en état, fonctionnement, plans conformes.","Trois issues : conformité → réception à la date de l'avis ; imperfections → OS avec délai, vérification sous 15 jours après le nouvel avis, réception à la date du dernier avis, sinon [[79]] ; anomalies mineures → réception prononcée et levée sous un mois au plus.","La durée des opérations préalables ne compte pas dans le délai. Prise de possession seulement après réception, sauf urgence avec état des lieux."]],"74":["Mise à disposition d'ouvrages",["Le maître d'ouvrage peut se faire remettre des ouvrages inachevés pour d'autres travaux, sans en prendre possession, avec ajournement correspondant.","États des lieux contradictoires avant et après ; réserves motivées possibles ; l'entrepreneur n'a pas la garde pendant cette période."]],"75":["Garanties contractuelles",["Délai de garantie : 12 mois à compter du PV de réception provisoire, sauf CPS.","Parfait achèvement à ses frais : reprise des imperfections signalées et travaux confortatifs, si la cause lui est imputable. Usure normale, abus d'usage et dommages de tiers exclus ; l'entretien courant revient au maître d'ouvrage.","Défauts signalés le dernier mois : réparés dans un délai fixé par OS, au plus 2 mois après la fin de la garantie. Sinon [[79]].","Garanties particulières au-delà du délai possibles par le CPS."]],"76":["Réception définitive",["Demande écrite au plus tard 20 jours avant la fin de la garantie ; désignation de la commission dans les 10 jours suivant son expiration.","Conditions : obligations remplies, indemnités d'occupation temporaire payées (loi 7-81), plans de récolement remis.","PV signé ; restitution des garanties ([[19]]). Sinon [[79]]."]],"77":["Réceptions partielles",["Possibles si le CPS fixe des délais partiels ; la dernière vaut réception provisoire du marché, la dernière définitive partielle vaut réception définitive.","La garantie court pour chaque partie à compter de sa réception ; [[73]], [[74]], [[75]] applicables."]],"78":["Responsabilité après réception définitive",["L'entrepreneur est dégagé, sauf garanties particulières ([[75]] B).","La réception définitive fait courir la responsabilité décennale (art. 769 du DOC)."]],"79":["Défaut d'exécution",["Manquement aux stipulations ou aux OS (sauf réserves régulières, [[11]] §5) : mise en demeure par OS, délai d'au moins 15 jours sauf urgence.","Sans effet, l'autorité compétente prononce sous 30 jours : a) résiliation simple, avec confiscation du cautionnement définitif, ou suivie d'un nouveau marché aux frais et risques, éventuellement avec exclusion temporaire ou définitive des marchés publics ; b) mise en régie partielle aux frais et risques, avec inventaire contradictoire, l'entrepreneur pouvant en être relevé.","Constat immédiat ; paiements suspendus jusqu'à l'achèvement ; excédents imputés sur les sommes dues puis les garanties ; économies acquises au maître d'ouvrage."]],"80":["Groupement d'entrepreneurs",["Mandataire défaillant : mise en demeure (≥ 15 jours), puis désignation d'un nouveau mandataire sous 10 jours par additif à la convention et avenant ; sinon [[79]] contre tous.","Groupement conjoint, membre défaillant : substitution par le mandataire ou proposition d'un remplaçant ou sous-traitant (art. 158 du décret).","Groupement solidaire : mise en demeure du mandataire et de tous les membres."]],"81":["Réclamations",["Réclamation et mémoire adressés au maître d'ouvrage par lettre recommandée ; réponse sous 30 jours.","Pas de réponse ou insatisfaction : saisine de l'autorité compétente par lettre recommandée sous 30 jours ; réponse sous 45 jours.","Ensuite : [[82]] ou [[83]]. Le recours se limite aux motifs du mémoire adressé à l'autorité compétente."]],"82":["Médiation ou arbitrage",["Dans les 30 jours suivant la réponse de l'autorité ou l'expiration des 45 jours, recours d'un commun accord à la médiation ou à l'arbitrage (code de procédure civile, loi 08-05 alors en vigueur)."]],"83":["Recours juridictionnel",["Dans les 60 jours suivant la réponse de l'autorité ou l'expiration des 45 jours, saisine de la juridiction administrative.","Passé ce délai, la décision est réputée acceptée et la réclamation éteinte."]],"84":["Litiges en cas de groupement",["Le mandataire représente les membres pour les [[81]] à [[83]] jusqu'à la réception définitive ; ensuite chaque membre poursuit ses propres litiges."]]},"TAUX":[["3 %","Cautionnement définitif, du montant initial (CPS)",[15]],["1/10","Retenue sur chaque acompte (CPS)",[64]],["7 %","Plafond de la retenue de garantie (CPS)",[64]],["4/5","Acompte sur approvisionnements",[64]],["1 %","Pénalité si définitif non constitué sans provisoire exigé",[18]],["1/1000 / j","Pénalité de retard sur le délai global (CPS)",[65]],["8 %","Plafond des pénalités de retard",[65]],["2 %","Plafond des pénalités particulières",[66]],["5/10 000 / j","Pénalité de non-évacuation après résiliation",[70]],["10 %","Plafond des travaux supplémentaires",[55]],["10 %","Plafond cumulé de l'augmentation dans la masse",[57]],["25 %","Seuil de diminution ouvrant droit à indemnité ou résiliation",[58]],["50 % et 10 %","Variation de quantité d'un prix ET part du montant initial",[59]],["15 %","Plafond d'indemnisation, du prix unitaire au-delà de +50 %",[59]],["± 50 %","Variation due à la révision permettant la résiliation",[54]]],"DEL":[["3 j","Renvoi de l'OS signé",[11]],["7 j","Second OS après réserves ; notification de force majeure ; réponse aux plans contestés",[11,47,13]],["8 j","Préavis de démontage ou démolition",[37]],["10 j","Explication écrite des réserves sur un OS (forclusion)",[11]],["10 j","Silence valant accord : représentant, retrait de matériel",[21,24]],["10 j","Avant fouilles : prévenir le gestionnaire des réseaux",[39]],["≥ 10 j","Entre l'OS de commencement et le démarrage",[40]],["10 j","Opérations préalables à la réception provisoire",[73]],["15 j","Notification de l'agent de suivi et du maître d'œuvre",[4]],["15 j","Observations sur les documents remis (CPS : 30 j max)",[13]],["15 j","Agrément du planning et des documents (silence = agrément)",[41]],["15 j + 15 j","Vérification des attachements, puis renvoi par l'entrepreneur",[61]],["≥ 15 j","Délai minimal de mise en demeure",[79]],["20 j","Constitution du cautionnement définitif",[15]],["20 j","Préavis d'atteinte de la masse initiale ; décision de poursuivre",[57]],["20 j","Demande de réception définitive avant la fin de la garantie",[76]],["30 j","OS de commencement après l'approbation",[40]],["30 j","Accord du maître d'ouvrage sur les attachements",[61]],["30 j","Mémoire de réclamation sur le décompte définitif",[68]],["30 j / 30 j / 45 j","Réponse du maître d'ouvrage / saisine de l'autorité / réponse de l'autorité",[81]],["40 j","Demandes d'indemnité ou de résiliation (ajournement, cessation)",[48,49]],["60 j","Recours juridictionnel",[83]],["4 mois / 8 mois","Retard de paiement : ajournement / résiliation",[67]],["12 mois","Délai de garantie (CPS) ; seuil d'ajournement ouvrant la résiliation",[75,48]]],"VIG":[["Les réserves sur un OS","Mention manuscrite « signé avec réserve » puis explication écrite sous 10 jours. Hors délai, la forclusion éteint le grief.",[11]],["Les attachements","Sans réponse dans les 15 jours, les attachements rectifiés par le maître d'ouvrage sont réputés acceptés. Les ouvrages enterrés (assainissement, couches de chaussée) doivent être relevés contradictoirement avant d'être couverts.",[61]],["Le décompte définitif","Un refus de signer sans réserves ferme toute réclamation. Signer avec réserves et déposer un mémoire chiffré sous 30 jours.",[68]],["La masse des travaux","Arrêter les travaux à la masse initiale sans OS de poursuite ; prévenir 20 jours avant. Au-delà, les travaux risquent de ne pas être payés.",[57]],["Les quantités du détail estimatif","Fréquent en routes (terrassements, purges) : prévenir dès que la variation dépasse 50 % et 10 % du marché pour préserver l'indemnisation.",[59]],["Sécurité et pénalités","Un arrêt de chantier pour sécurité ne prolonge pas le délai : il peut déclencher des pénalités de retard.",[33]],["Le mémoire de réclamation","Le recours ne peut porter que sur les motifs du mémoire adressé à l'autorité compétente : tout chiffrer dès cette étape.",[81]],["Les réseaux enterrés","Le maître d'ouvrage doit fournir leur position ; l'entrepreneur doit prévenir le gestionnaire 10 jours avant les fouilles.",[39]]]};
const {CH, A, TAUX, DEL, VIG} = DATA;
const STAR_ON="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z";
const STAR_OFF="M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z";
const $=s=>document.querySelector(s);
const view=$('#view');
const lk=n=>`<a class="x" href="#/a/${n}">art.&nbsp;${n}</a>`;
const R=s=>s.replace(/\[\[(\d+)\]\]/g,(m,n)=>lk(n));
const refs=a=>a.map(lk).join(', ');
const chOf=n=>CH.find(c=>n>=c.from&&n<=c.to);
const strip=s=>s.replace(/\[\[(\d+)\]\]/g,'art. $1').replace(/<[^>]+>/g,'');
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

// favoris (stockage local du téléphone)
let FAV=[];try{FAV=JSON.parse(localStorage.getItem('fav')||'[]')}catch(e){}
const saveFav=()=>{try{localStorage.setItem('fav',JSON.stringify(FAV))}catch(e){}};
const isFav=n=>FAV.includes(+n);

// renvois entrants
const BACK={};
for(let n=1;n<=84;n++){(JSON.stringify(A[n][1]).match(/\[\[(\d+)\]\]/g)||[]).forEach(m=>{const t=+m.slice(2,-2);if(t!==n)(BACK[t]=BACK[t]||new Set()).add(n)})}

function chrome(title,tab,{back=false,star=null}={}){
  $('#title').textContent=title;
  $('#back').hidden=!back;
  const s=$('#star'); s.hidden=star===null;
  if(star!==null){$('#starp').setAttribute('d',isFav(star)?STAR_ON:STAR_OFF);s.onclick=()=>{const n=+star;FAV=isFav(n)?FAV.filter(x=>x!==n):[...FAV,n];saveFav();$('#starp').setAttribute('d',isFav(n)?STAR_ON:STAR_OFF)}}
  document.querySelectorAll('nav.bottom a').forEach(a=>a.classList.toggle('on',a.dataset.tab===tab));
  window.scrollTo(0,0);
}
const artRow=n=>`<a class="row" href="#/a/${n}"><span class="n">${n}</span><span class="t">${A[n][0]}</span>${isFav(n)?'<span class="st">★</span>':''}</a>`;

const V={
home(){
  chrome('CCAG-T 2016','home');
  const flow=[["J","Notification de l'approbation",[]],["≤ 5 j ouvr.","Remise des pièces certifiées",[13]],["≤ 20 j","Cautionnement définitif 3 %",[15]],["≤ 30 j","OS de commencement",[40]],["≥ 10 j","Démarrage après l'OS",[40]],["Mensuel","Attachements et décomptes",[61,62]],["+ 10 j","Réception provisoire après l'avis d'achèvement",[73]],["12 mois","Délai de garantie",[75]],["10 ans","Décennale après réception définitive",[78]]];
  view.innerHTML=`
  <span class="eye">Marchés publics de travaux · Maroc</span>
  <h2>Cahier des clauses administratives générales – travaux</h2>
  <div class="card meta"><b>Décret</b><span>n° 2-14-394 du 13 mai 2016</span><b>BO</b><span>n° 6470 du 2 juin 2016</span><b>En vigueur</b><span>1er octobre 2016</span><b>Abroge</b><span>CCAG-T 2000 (décret 2-99-1087)</span></div>
  <div class="note"><b>À vérifier :</b> le décret 2-12-349 cité a été remplacé par le décret 2-22-431 (2023), et la loi 08-05 sur l'arbitrage par la loi 95-17. Les numéros d'articles du décret renvoient à l'ancien texte.</div>
  <h3>Les 9 chapitres</h3>
  ${CH.map(c=>`<div class="card"><a class="chap" href="#/c/${c.id}"><span class="badge">${c.num}</span><span><span class="t">${c.title}</span><br><span class="s">Articles ${c.from} à ${c.to}</span></span></a></div>`).join('')}
  <h3>Le parcours d'un marché</h3>
  <div class="card flow">${flow.map(([d,t,a])=>`<div class="stp"><span class="d">${d}</span><span>${t} ${a.length?refs(a):''}</span></div>`).join('')}</div>
  <p class="small muted">Résumé d'analyse du texte publié au Bulletin officiel n° 6470, qui reste la seule référence juridique.</p>`;
},
chap(id){
  const c=CH.find(x=>x.id===id); if(!c) return V.home();
  chrome(`Chapitre ${c.num}`,'home',{back:true});
  const arts=[];for(let n=c.from;n<=c.to;n++)arts.push(artRow(n));
  view.innerHTML=`<span class="eye">Chapitre ${c.num} · art. ${c.from} à ${c.to}</span><h2>${c.title}</h2>
  <div class="card">${R(c.syn)}</div>
  <h3>Points clés</h3><div class="card"><ul class="pts">${c.keys.map(k=>`<li>${R(k)}</li>`).join('')}</ul></div>
  <h3>Articles</h3><div class="list">${arts.join('')}</div>`;
},
art(n){
  n=+n; if(!A[n]) return V.articles();
  const [t,pts]=A[n], c=chOf(n), b=BACK[n]?[...BACK[n]].sort((x,y)=>x-y):[];
  chrome(`Article ${n}`,'articles',{back:true,star:n});
  view.innerHTML=`<a class="eye" style="text-decoration:none" href="#/c/${c.id}">Chapitre ${c.num} · ${c.title}</a>
  <div class="art-h"><span class="n">${n===1?'1er':n}</span><h2>${t}</h2></div>
  <div class="card"><ul class="pts">${pts.map(p=>`<li>${R(p)}</li>`).join('')}</ul></div>
  ${b.length?`<p class="small muted">Cité par : ${refs(b)}</p>`:''}
  <div class="pager">${n>1?`<a href="#/a/${n-1}"><span>← Art. ${n-1}</span>${A[n-1][0]}</a>`:'<span></span>'}${n<84?`<a class="r" href="#/a/${n+1}"><span>Art. ${n+1} →</span>${A[n+1][0]}</a>`:'<span></span>'}</div>`;
},
articles(){
  chrome('Articles','articles');
  view.innerHTML=`<div class="search"><input id="q" type="search" placeholder="Rechercher : pénalité, garantie, 10 %…" autocomplete="off"></div><div id="res"></div>`;
  const q=$('#q'), res=$('#res');
  let saved='';try{saved=sessionStorage.getItem('q')||''}catch(e){} q.value=saved;
  const draw=()=>{
    const v=norm(q.value.trim()); try{sessionStorage.setItem('q',q.value)}catch(e){}
    let h='',k=0;
    CH.forEach(c=>{let rows='';for(let n=c.from;n<=c.to;n++){const txt=norm(A[n][0]+' '+strip(A[n][1].join(' '))+' '+n);if(!v||txt.includes(v)){rows+=artRow(n);k++}}
      if(rows)h+=`<div class="grp">Ch. ${c.num} · ${c.title}</div><div class="list">${rows}</div>`;});
    res.innerHTML=v?`<p class="small muted">${k} article${k>1?'s':''}</p>`+(h||'<div class="empty">Aucun article ne contient ce terme.</div>'):h;
  };
  q.addEventListener('input',draw); draw();
},
chiffres(tab){
  tab=tab||'taux'; chrome('Délais & taux','chiffres');
  const T=rows=>`<div class="card" style="padding:4px 10px"><table class="tbl">${rows.map(([v,t,a])=>`<tr><td class="v">${v}</td><td>${t}</td><td class="a">${refs(a)}</td></tr>`).join('')}</table></div>`;
  const body= tab==='taux'?T(TAUX): tab==='delais'?T(DEL): VIG.map(([t,d,a])=>`<div class="card"><b>${t}</b><p style="margin:6px 0">${d}</p><span class="small">${refs(a)}</span></div>`).join('');
  view.innerHTML=`<div class="seg">${[['taux','Taux'],['delais','Délais'],['vigilance','Vigilance']].map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="location.hash='#/chiffres/${k}'">${l}</button>`).join('')}</div>
  <p class="small muted">Valeurs par défaut du CCAG-T ; le CPS peut en fixer d'autres lorsque le texte le permet.</p>${body}`;
},
favoris(){
  chrome('Favoris','favoris');
  const f=[...FAV].sort((a,b)=>a-b);
  view.innerHTML=f.length?`<div class="list">${f.map(artRow).join('')}</div>`:`<div class="empty">Aucun favori pour l'instant.<br>Ouvrez un article et touchez l'étoile en haut à droite pour l'ajouter ici.</div>`;
}
};

function route(){
  const p=(location.hash||'#/').slice(2).split('/');
  if(p[0]==='a')V.art(p[1]); else if(p[0]==='c')V.chap(p[1]); else if(p[0]==='articles')V.articles();
  else if(p[0]==='chiffres')V.chiffres(p[1]); else if(p[0]==='favoris')V.favoris(); else V.home();
}
$('#back').onclick=()=>history.length>1?history.back():(location.hash='#/');
window.addEventListener('hashchange',route); route();
</script>
</body>
</html>
